services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/hoher2000/tg-max-vk:latest
    container_name: tg-max-vk
    restart: unless-stopped

    # Загружаем секреты из .env.
    env_file:
      - .env

    volumes:
      # Конфиг только для чтения — чтобы случайно не изменили из контейнера.
      - ./configs/config.yaml:/app/configs/config.yaml:ro
      # Данные (SQLite, сессия) — на хосте, чтобы пережили пересборку контейнера.
      - ./data:/app/data

    # Логи в json — удобно парсить, если добавим Loki позже.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Ограничение ресурсов — на всякий случай.
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M